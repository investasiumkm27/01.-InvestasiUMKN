<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="google-site-verification" content="googlec273590b2addbf40">
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-M5JR1ZYEYR"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-M5JR1ZYEYR');

    <meta name="description" content="Masuk ke akun InvestasiUMKM untuk mengakses portfolio dan layanan investasi Anda.">
    <meta name="robots" content="noindex, nofollow">
    <meta name="theme-color" content="#059669">
    <link rel="canonical" href="https://investasibengkulu.my.id/login/">
    <title>Login InvestasiUMKM</title>
    
    <style>
        /* ==========================================================================
           1. VARIABLES & RESET
           ========================================================================== */
        :root {
            --bg-main: #f4f6f8;
            --bg-card: #ffffff;
            --bg-input: #f8fafc;
            --border-color: #e2e8f0;
            --border-hover: #cbd5e1;
            
            --text-primary: #0f172a;
            --text-secondary: #334155;
            --text-muted: #64748b;
            
            --accent-brand: #059669;
            --accent-brand-hover: #047857;
            --accent-brand-bg: #ecfdf5;
            --accent-red: #dc2626;
            --accent-red-bg: #fef2f2;
            
            --radius-sm: 6px;
            --radius-md: 10px;
            --radius-lg: 14px;
            --radius-full: 9999px;
            --shadow-sm: 0 1px 3px 0 rgba(15, 23, 42, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(15, 23, 42, 0.08), 0 2px 4px -2px rgba(15, 23, 42, 0.04);
            --shadow-lg: 0 10px 25px -3px rgba(15, 23, 42, 0.1), 0 4px 6px -4px rgba(15, 23, 42, 0.05);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html, body {
            width: 100%;
            max-width: 100%;
            min-height: 100vh;
            overflow-x: hidden;
            background-color: var(--bg-main);
            color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.5;
            -webkit-text-size-adjust: 100%;
        }

        body {
            display: flex;
            flex-direction: column;
        }

        /* ==========================================================================
           2. HEADER & NAVBAR
           ========================================================================== */
        header {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border-color);
            padding: 12px 16px;
            position: sticky;
            top: 0;
            z-index: 100;
            box-shadow: var(--shadow-sm);
            width: 100%;
            animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
        }

        .logo-box {
            display: flex;
            align-items: center;
            gap: 8px;
            text-decoration: none;
            min-width: 0;
        }

        .logo-icon {
            width: 34px;
            height: 34px;
            background-color: #0f172a;
            color: #ffffff;
            font-weight: 800;
            border-radius: var(--radius-sm);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 0.85rem;
            letter-spacing: 0.05em;
            border-left: 3px solid var(--accent-brand);
            flex-shrink: 0;
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .logo-box:hover .logo-icon {
            transform: scale(1.05) rotate(-3deg);
        }

        .logo-text {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.02em;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .logo-text span {
            color: var(--accent-brand);
            font-weight: 600;
        }

        /* ==========================================================================
           3. MAIN & AUTH FORM
           ========================================================================== */
        main {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 30px 16px;
        }

        .auth-card {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 28px 24px;
            box-shadow: var(--shadow-lg);
            width: 100%;
            max-width: 420px;
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
            opacity: 0;
            transform: translateY(20px);
        }

        .auth-title {
            font-size: 1.35rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 4px;
            letter-spacing: -0.02em;
        }

        .auth-subtitle {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-bottom: 24px;
        }

        .form-group {
            margin-bottom: 16px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: 700;
            color: var(--text-primary);
            margin-bottom: 6px;
        }

        .form-input {
            width: 100%;
            background-color: var(--bg-input);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-md);
            padding: 12px;
            color: var(--text-primary);
            font-size: 0.9rem;
            font-weight: 600;
            outline: none;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .form-input:focus {
            background-color: #ffffff;
            border-color: var(--accent-brand);
            box-shadow: 0 0 0 3px rgba(5, 150, 105, 0.15);
            transform: translateY(-1px);
        }

        .password-container {
            position: relative;
            width: 100%;
        }

        .password-container .form-input {
            padding-right: 44px;
        }

        .password-toggle-btn {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            background: transparent;
            border: none;
            cursor: pointer;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 4px;
            transition: color 0.2s ease, transform 0.2s ease;
        }

        .password-toggle-btn:hover {
            color: var(--text-primary);
            transform: translateY(-50%) scale(1.1);
        }

        .password-toggle-btn svg {
            transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .btn {
            width: 100%;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            padding: 12px;
            border-radius: var(--radius-md);
            border: none;
            cursor: pointer;
            font-size: 0.9rem;
            transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
            text-decoration: none;
            letter-spacing: 0.01em;
            margin-top: 8px;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(5, 150, 105, 0.2);
        }

        .btn:active { 
            transform: translateY(0) scale(0.98); 
            box-shadow: none;
        }

        .btn-brand {
            background-color: var(--accent-brand);
            color: #ffffff;
        }

        .btn-brand:hover {
            background-color: var(--accent-brand-hover);
        }

        .btn-brand:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .auth-footer {
            margin-top: 20px;
            padding-top: 16px;
            border-top: 1px solid var(--border-color);
            text-align: center;
            font-size: 0.82rem;
            color: var(--text-muted);
        }

        .auth-footer a {
            color: var(--accent-brand);
            font-weight: 700;
            text-decoration: none;
            transition: opacity 0.2s ease;
        }

        .auth-footer a:hover {
            text-decoration: underline;
            opacity: 0.85;
        }

        /* ==========================================================================
           4. CUSTOM NOTIFICATION MODAL & ANIMATIONS
           ========================================================================== */
        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes slideUpFade {
            from {
                opacity: 0;
                transform: translateY(20px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; backdrop-filter: blur(0px); }
            to { opacity: 1; backdrop-filter: blur(4px); }
        }

        @keyframes scaleUp {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        #custom-modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background-color: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(4px);
            z-index: 10000;
            justify-content: center;
            align-items: center;
            padding: 16px;
            animation: fadeIn 0.25s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        .custom-modal-box {
            background-color: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: var(--radius-lg);
            padding: 24px;
            max-width: 380px;
            width: 100%;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            text-align: center;
            transform: scale(0.9);
            animation: scaleUp 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        }

        .custom-modal-icon {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background-color: var(--accent-brand-bg);
            color: var(--accent-brand);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.25rem;
            font-weight: 800;
            margin: 0 auto 14px auto;
            border: 2px solid rgba(5, 150, 105, 0.2);
            animation: pulseIcon 2s infinite ease-in-out;
        }

        .custom-modal-icon.error {
            background-color: var(--accent-red-bg);
            color: var(--accent-red);
            border-color: rgba(220, 38, 38, 0.2);
        }

        @keyframes pulseIcon {
            0% { transform: scale(1); }
            50% { transform: scale(1.06); }
            100% { transform: scale(1); }
        }

        .custom-modal-title {
            font-size: 0.95rem;
            font-weight: 800;
            color: var(--text-primary);
            margin-bottom: 6px;
            letter-spacing: -0.01em;
        }

        .custom-modal-message {
            font-size: 0.78rem;
            color: var(--text-secondary);
            line-height: 1.5;
            margin-bottom: 18px;
            font-weight: 500;
        }

        /* ==========================================================================
           5. FOOTER
           ========================================================================== */
        footer {
            background-color: var(--bg-card);
            border-top: 1px solid var(--border-color);
            padding: 24px 16px;
            text-align: center;
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-top: auto;
            width: 100%;
            animation: slideUpFade 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
        }

        footer p + p { margin-top: 6px; font-size: 0.68rem; color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- Header Navbar -->
    <header>
        <div class="header-container">
            <a href="../" class="logo-box">
                <div class="logo-icon">BI</div>
                <div class="logo-text">InvestasiUMKM</div>
            </a>
        </div>
    </header>

    <main>
        <div class="auth-card">
            <h1 class="auth-title">Masuk ke Portal</h1>
            <p class="auth-subtitle">Masukkan kredensial Anda untuk mengakses akun.</p>

            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Alamat Email</label>
                    <input type="email" id="email" class="form-input" placeholder="nama@email.com" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password">Kata Sandi</label>
                    <div class="password-container">
                        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                        <button type="button" id="togglePassword" class="password-toggle-btn" aria-label="Tampilkan atau sembunyikan kata sandi">
                            <svg id="eyeIcon" xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn btn-brand">Masuk Sekarang</button>
            </form>

            <div class="auth-footer">
                Belum memiliki akun? <a href="../daftar/">Daftar Akun Baru</a>
            </div>
        </div>
    </main>

    <!-- Custom Modern Notification Modal Overlay -->
    <div id="custom-modal-overlay">
        <div class="custom-modal-box">
            <div id="custom-modal-icon" class="custom-modal-icon">✓</div>
            <h3 id="custom-modal-title" class="custom-modal-title">Pemberitahuan Sistem</h3>
            <p id="custom-modal-message" class="custom-modal-message">Pesan notifikasi sistem...</p>
            <button id="custom-modal-btn" class="btn btn-brand" style="width: 100%;">Mengerti</button>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>&copy; 2026 InvestasiUMKM &bull; Portal Informasi Investasi</p>
        <p>Layanan informasi terpadu proyek dan investasi untuk masyarakat Indonesia.</p>
    </footer>

    <!-- Script Integrasi Firebase Auth untuk Login -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

        // Konfigurasi Firebase Anda
        const firebaseConfig = {
            apiKey: "AIzaSyDlgpm04sI7Jweytg2IzTHgp8w-VM1SMKw",
            authDomain: "investasi-bengkulu.firebaseapp.com",
            projectId: "investasi-bengkulu",
            storageBucket: "investasi-bengkulu.firebasestorage.app",
            messagingSenderId: "273258663588",
            appId: "1:273258663588:web:a4c96b4d438a4462fca031"
        };

        // Inisialisasi Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        let modalCallback = null;

        // Helper untuk menampilkan Modal Kustom yang Elegan
        function showNotification(title, message, isError = false, callback = null) {
            const overlay = document.getElementById('custom-modal-overlay');
            const titleEl = document.getElementById('custom-modal-title');
            const msgEl = document.getElementById('custom-modal-message');
            const iconEl = document.getElementById('custom-modal-icon');
            
            titleEl.textContent = title;
            msgEl.textContent = message;
            modalCallback = callback;
            
            if (isError) {
                iconEl.className = 'custom-modal-icon error';
                iconEl.textContent = '!';
            } else {
                iconEl.className = 'custom-modal-icon';
                iconEl.textContent = '✓';
            }
            
            overlay.style.display = 'flex';
        }

        document.getElementById('custom-modal-btn').addEventListener('click', () => {
            const overlay = document.getElementById('custom-modal-overlay');
            overlay.style.opacity = '0';
            setTimeout(() => {
                overlay.style.display = 'none';
                overlay.style.opacity = '1';
                if (typeof modalCallback === 'function') {
                    modalCallback();
                    modalCallback = null;
                }
            }, 200);
        });

        document.addEventListener('DOMContentLoaded', () => {
            const loginForm = document.getElementById('loginForm');
            const togglePassword = document.getElementById('togglePassword');
            const passwordInput = document.getElementById('password');
            const eyeIcon = document.getElementById('eyeIcon');

            // Fungsionalitas Toggle Show/Hide Password dengan Animasi Mikro Interaktif
            togglePassword.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                
                // Efek animasi putar/skala kecil pada ikon saat diklik
                eyeIcon.style.transform = 'scale(0.7) rotate(20deg)';
                eyeIcon.style.opacity = '0.3';

                setTimeout(() => {
                    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');

                    if (isPassword) {
                        // Ikon mata tercoret / sembunyikan password
                        eyeIcon.innerHTML = `
                            <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
                            <line x1="1" y1="1" x2="23" y2="23"></line>
                        `;
                    } else {
                        // Ikon mata normal / tampilkan password
                        eyeIcon.innerHTML = `
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                            <circle cx="12" cy="12" r="3"></circle>
                        `;
                    }

                    eyeIcon.style.transform = 'scale(1) rotate(0deg)';
                    eyeIcon.style.opacity = '1';
                }, 150);
            });

            loginForm.addEventListener('submit', async (e) => {
                e.preventDefault();

                const email = document.getElementById('email').value.trim();
                const password = passwordInput.value;
                const submitBtn = loginForm.querySelector('button[type="submit"]');

                try {
                    submitBtn.disabled = true;
                    submitBtn.textContent = 'Memproses...';

                    // Proses login menggunakan Firebase Authentication
                    await signInWithEmailAndPassword(auth, email, password);

                    showNotification(
                        'Login Berhasil',
                        'Selamat datang kembali! Anda berhasil masuk ke akun.',
                        false,
                        () => { window.location.href = '../'; }
                    );

                } catch (error) {
                    console.error("Gagal masuk:", error);
                    let errorMessage = "Terjadi kesalahan saat masuk.";
                    
                    if (error.code === 'auth/user-not-found' || error.code === 'auth/wrong-password' || error.code === 'auth/invalid-credential') {
                        errorMessage = "Email atau kata sandi salah.";
                    } else if (error.code === 'auth/invalid-email') {
                        errorMessage = "Format alamat email tidak valid.";
                    } else if (error.code === 'auth/too-many-requests') {
                        errorMessage = "Terlalu banyak percobaan gagal. Silakan coba beberapa saat lagi.";
                    } else {
                        errorMessage = error.message;
                    }
                    
                    showNotification('Login Gagal', errorMessage, true);
                    submitBtn.disabled = false;
                    submitBtn.textContent = 'Masuk Sekarang';
                }
            });
        });
    </script>

</body>
</html>
